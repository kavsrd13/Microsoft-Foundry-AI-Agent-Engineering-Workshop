<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Resident enquiries</title>
<style>body{font:18px system-ui;max-width:760px;margin:48px auto;padding:20px}textarea{width:100%;height:90px}button{padding:12px;margin:12px 8px 12px 0}pre{white-space:pre-wrap;background:#f3f1f8;padding:20px}</style>
<h1>Resident enquiries</h1><p>Sign in to ask a question about records you can access.</p><button id="login">Sign in</button>
<textarea id="question" aria-label="Question">When is the next collection?</textarea><button id="send" disabled>Ask</button><pre id="output" aria-live="polite"></pre>
<script src="https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js"></script><script>
let token;
const output=document.getElementById('output');
const ready=fetch('/config').then(r=>r.json()).then(c=>({c,auth:new msal.PublicClientApplication({auth:{clientId:c.client,authority:'https://login.microsoftonline.com/'+c.tenant,redirectUri:location.origin},cache:{cacheLocation:'memoryStorage'}})}));
document.getElementById('login').onclick=async()=>{try{const {c,auth}=await ready;const result=await auth.loginPopup({scopes:[c.scope]});token=result.accessToken;document.getElementById('send').disabled=false;output.textContent='Signed in';}catch(e){output.textContent=e.message;}};
document.getElementById('send').onclick=async()=>{output.textContent='';try{const response=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({question:document.getElementById('question').value})});if(!response.ok){output.textContent='Request failed ('+response.status+'). Sign in again or check your permissions.';return;}
const reader=response.body.getReader(),decoder=new TextDecoder();let buffer='',completed=false;while(true){const {value,done}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});let boundary;while((boundary=buffer.indexOf('\n\n'))>=0){const record=JSON.parse(buffer.slice(0,boundary).replace(/^data: /,''));buffer=buffer.slice(boundary+2);if(record.done)completed=true;if(record.delta)output.textContent+=record.delta;if(record.sources)output.textContent+='Sources: '+record.sources.join(', ')+'\n\n';}}if(!completed)output.textContent+='\nIncomplete response. Please retry.';
}catch(e){output.textContent+='\nConnection interrupted. Please retry.';}};
</script></html>
